name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  Configuration: Release

jobs:
  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore OmniReport.slnx

      - name: Build (0 warnings expected)
        run: dotnet build OmniReport.slnx -c Release --no-restore

      - name: Test + coverage
        run: >
          dotnet test OmniReport.slnx -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: ./TestResults/**/*.trx

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: ./TestResults/**/coverage.cobertura.xml

  build-linux:
    # O nome deste job é um CHECK OBRIGATÓRIO no ruleset "Proteção da main". Renomeá-lo faz o check
    # exigido parar de reportar e o PR fica bloqueado para sempre, com todo o CI verde — foi o que
    # aconteceu quando este PR tirou o "subset" do nome. Ele já não descreve bem o job (a cobertura
    # subiu de 15 para 57 dos 62 projetos), mas trocar o nome exige atualizar o ruleset junto, nas
    # configurações do repositório. Enquanto isso não for feito, o nome fica como está.
    name: Build & Test (Linux, cross-plat subset)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # SkiaSharp precisa do fontconfig nativo no Linux (medição/render de texto);
      # sem isso, Reporting.Rendering.Tests falha no runner ubuntu.
      - name: Install SkiaSharp native deps (libfontconfig)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      # A lista de projetos é DERIVADA, não mantida à mão. Antes eram 15 caminhos hardcoded de 62 projetos
      # em src/+tests/ — ou seja, todo projeto novo nascia fora da verificação cross-platform e ninguém
      # percebia. Agora entra tudo, menos o que fisicamente não compila no Linux: os 5 projetos de TFM
      # net10.0-windows / android (GDI, WindowsSpooler + testes, Android). Um projeto novo é coberto no dia
      # em que é criado; se algum dia ele NÃO puder rodar no Linux, isso vira falha visível de CI em vez de
      # ausência silenciosa.
      # Os projetos entram numa solução descartável em vez de serem buildados um a um em loop: assim
      # há UM restore e UM build para os 57, em vez de um restore implícito por projeto. O mesmo
      # mecanismo roda no security.yml, então os dois workflows cobrem exatamente o mesmo conjunto.
      - name: Descobrir projetos cross-platform
        run: |
          set -euo pipefail
          find src tests -name '*.csproj' | grep -vE '(Rendering\.Gdi|Printing\.WindowsSpooler|Printing\.Android)' | sort > cross-plat.txt
          echo "Projetos cobertos no Linux: $(wc -l < cross-plat.txt)"
          cat cross-plat.txt
          dotnet new sln -n CrossPlat -f slnx --force
          xargs -a cross-plat.txt dotnet sln CrossPlat.slnx add

      - name: Restore
        run: dotnet restore CrossPlat.slnx

      - name: Build
        run: dotnet build CrossPlat.slnx -c Release --no-restore

      - name: Test
        run: dotnet test CrossPlat.slnx -c Release --no-build --verbosity minimal

  pack:
    name: Pack NuGets
    runs-on: windows-latest
    needs: [build-windows, build-linux]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OmniReport.slnx

      - name: Build
        run: dotnet build OmniReport.slnx -c Release --no-restore

      # Empacota TODOS os projetos com IsPackable=true (os de src/). Ficam de fora via
      # <IsPackable>false</IsPackable>: samples, testes e benchmarks (Directory.Build.props)
      # e o stub do Android (no próprio csproj, na PropertyGroup do caminho sem workload —
      # até este PR a propriedade NÃO existia e o stub era publicado de fato).
      # Inclui símbolos (.snupkg) por causa do IncludeSymbols no Directory.Build.props.
      - name: Pack
        run: dotnet pack OmniReport.slnx -c Release --no-build -o ./artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
