version: 2

updates:
  # NuGet. As versões são centralizadas em Directory.Packages.props (CPM), então é lá que o Dependabot
  # abre os PRs — um por grupo, não um por pacote, para não afogar a fila de review.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    ignore:
      # FluentAssertions parou na 6.x DE PROPÓSITO, por licença e não por técnica. A 6.12.2 é
      # Apache-2.0 (licenseExpression no catálogo do NuGet); a partir da 8.x o pacote não declara SPDX e
      # embarca um LICENSE que começa com "XCEED SOFTWARE INC. COMMUNITY LICENSE AGREEMENT (for
      # Non-Commercial Use)". Trocar Apache-2.0 por licença proprietária de uso não-comercial, num
      # projeto distribuído em 39 pacotes no NuGet, é decisão de produto — não item de atualização
      # semanal. Sem esta regra o PR reabre toda segunda e a decisão vira ruído, com risco de ser
      # mergeada por distração.
      #
      # Só o major é ignorado: patch e minor do 6.x continuam chegando normalmente. Sair do 6.x é
      # migrar de biblioteca (AwesomeAssertions, Shouldly), não subir versão.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
    groups:
      # Microsoft.*/System.* sobem em conjunto: o CPM do repo pina EF Core e afins num "trem de versões",
      # e subir um pacote isolado gera NU1109 por desalinhamento.
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      # Stack de teste — churn alto, risco baixo, revisão em bloco.
      test-stack:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "Verify.*"
          - "bunit*"
          - "coverlet.*"
      # Todo o resto, agrupado para caber num PR por semana.
      outros:
        patterns: ["*"]
        exclude-patterns:
          - "Microsoft.*"
          - "System.*"
          - "xunit*"
          - "FluentAssertions"
          - "Verify.*"
          - "bunit*"
          - "coverlet.*"

  # Actions do próprio CI: versão pinada que envelhece em silêncio é vetor de supply chain.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies]
